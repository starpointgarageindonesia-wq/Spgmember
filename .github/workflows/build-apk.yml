name: Build Starpoint Garage Member v111 (installable preview + unsigned release)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-member:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install official Android SDK command-line tools and Android 35
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/starpoint-android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify resume does not force a page reload
        shell: bash
        run: |
          ! grep -q 'lastBackgroundAt' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          ! grep -q 'protected void onResume()' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'alwaysRetainTaskState' app/src/main/AndroidManifest.xml
          grep -q 'launchMode="singleTask"' app/src/main/AndroidManifest.xml
          grep -q 'onRenderProcessGone' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'addMemberStateRecovery' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          test -s app/src/main/assets/member_state_recovery.js
          node --check app/src/main/assets/member_state_recovery.js
          grep -q 'onPause()' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'readCachedTrustedHtml' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'openBooking = function' app/src/main/assets/member_state_recovery.js
          grep -q "sheetType = 'booking'" app/src/main/assets/member_state_recovery.js
          grep -q 'Save the sheet even if no field has been edited' app/src/main/assets/member_state_recovery.js
          grep -q '__spgMemberSaveDraft' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          ! grep -q 'FLAG_ACTIVITY_CLEAR_TASK' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'rendererGone' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'moveTaskToBack(true)' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'removeView(old)' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          ! grep -q 'webView.saveState(outState)' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q "versionCode 111" app/build.gradle
      - name: Build Member release unsigned
        run: gradle --no-daemon :app:assembleMemberRelease
      - name: Collect APK and signing utility (NO PRIVATE KEYS)
        shell: bash
        run: |
          mkdir -p build-for-local-signing
          find app/build/outputs/apk/member/release -maxdepth 1 -type f -print
          cp app/build/outputs/apk/member/release/*unsigned.apk build-for-local-signing/Starpoint_Member_v111_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-for-local-signing/apksigner.jar
      - name: Upload unsigned APK and official apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Starpoint-Member-v111-ToSign
          path: build-for-local-signing/*
          if-no-files-found: error

      - name: Build installable Member preview APK (debug-signing only)
        run: gradle --no-daemon :app:assembleMemberDebug
      - name: Prepare directly downloadable preview APK
        shell: bash
        run: |
          mkdir -p preview-apk
          APK_PATH=$(find app/build/outputs/apk/member/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" preview-apk/Starpoint_Member_v111_CrashFix.apk
          unzip -t preview-apk/Starpoint_Member_v111_CrashFix.apk >/dev/null
          ls -lh preview-apk/Starpoint_Member_v111_CrashFix.apk
      - name: Archive installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Starpoint-Member-v111-crashfix-APK
          path: preview-apk/Starpoint_Member_v111_CrashFix.apk
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create spg-member-v111-crash-fix preview-apk/Starpoint_Member_v111_CrashFix.apk --target "$GITHUB_SHA" --title "Starpoint Garage Member v111 Preview APK" --notes "Preview v111 with booking-draft persistence at modal open/input/pause, immediate task reuse without CLEAR_TASK and recovery after renderer death. Package is separate from installed production apps." --prerelease
