name: Build Starpoint Garage Member v106 (unsigned for secure local signing)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-member:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install official Android SDK command-line tools and Android 35
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/starpoint-android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Member release unsigned
        run: gradle --no-daemon :app:assembleMemberRelease
      - name: Collect APK and signing utility (NO PRIVATE KEYS)
        shell: bash
        run: |
          mkdir -p build-for-local-signing
          find app/build/outputs/apk/member/release -maxdepth 1 -type f -print
          cp app/build/outputs/apk/member/release/*unsigned.apk build-for-local-signing/Starpoint_Member_v106_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-for-local-signing/apksigner.jar
      - name: Upload unsigned APK and official apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Starpoint-Member-v106-ToSign
          path: build-for-local-signing/*
          if-no-files-found: error
