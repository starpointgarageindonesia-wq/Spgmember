name: Build Starpoint Garage Member v108 (installable preview + unsigned release)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-member:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install official Android SDK command-line tools and Android 35
        shell: bash
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/starpoint-android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify resume does not force a page reload
        shell: bash
        run: |
          ! grep -q 'lastBackgroundAt' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          ! grep -q 'protected void onResume()' app/src/main/java/com/starpointgarage/mobile/MainActivity.java
          grep -q 'alwaysRetainTaskState' app/src/main/AndroidManifest.xml
      - name: Build Member release unsigned
        run: gradle --no-daemon :app:assembleMemberRelease
      - name: Collect APK and signing utility (NO PRIVATE KEYS)
        shell: bash
        run: |
          mkdir -p build-for-local-signing
          find app/build/outputs/apk/member/release -maxdepth 1 -type f -print
          cp app/build/outputs/apk/member/release/*unsigned.apk build-for-local-signing/Starpoint_Member_v108_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-for-local-signing/apksigner.jar
      - name: Upload unsigned APK and official apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Starpoint-Member-v108-ToSign
          path: build-for-local-signing/*
          if-no-files-found: error

      - name: Build installable Member preview APK (debug-signing only)
        run: gradle --no-daemon :app:assembleMemberDebug
      - name: Prepare directly downloadable preview APK
        shell: bash
        run: |
          mkdir -p preview-apk
          APK_PATH=$(find app/build/outputs/apk/member/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" preview-apk/Starpoint_Member_v108_Background.apk
          unzip -t preview-apk/Starpoint_Member_v108_Background.apk >/dev/null
          ls -lh preview-apk/Starpoint_Member_v108_Background.apk
      - name: Archive installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Starpoint-Member-v108-background-APK
          path: preview-apk/Starpoint_Member_v108_Background.apk
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create spg-member-v108-preview preview-apk/Starpoint_Member_v108_Background.apk --target "$GITHUB_SHA" --title "Starpoint Garage Member v108 Preview APK" --notes "Preview APK: WebView tetap di halaman yang sama ketika pindah aplikasi dan kembali; tidak reload pada onResume. Tombol Booking, Store Maps dan rating Google tetap tersedia. Menggunakan package terpisah dan debug signing, tidak dapat menggantikan APK produksi lama." --prerelease
